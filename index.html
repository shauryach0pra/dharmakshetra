  {panel:'plot',title:'The House of Lac',text:'Fearing the Pandavas\u2019 fame, Duryodhana had a palace built for them at Varanavata out of lac, wax and resin, ready to burn. Wise Vidura warned Yudhishthira in a riddle: the one who lives in a burrow is not burned by the forest fire. The Pandavas quietly dug a tunnel.'},
  {lesson:'vidura'},
  {who:'narrator',text:'On a moonless night the Pandavas set the palace alight themselves, before Purochana could, and Duryodhana\u2019s man was caught in his own trap. But his guards are still in the halls, and the flames are spreading faster than anyone expected.'}],
 tunnel:[{who:'narrator',text:'Bhima reached the tunnel with his mother and brothers. Behind them, the house of lac collapsed. In Hastinapura the Kauravas mourned them in public, and believed them dead.'},
  {who:'narrator',text:'The epic does not hide a grim detail: a forest woman and her five sons had been sleeping in the palace that night. They were found in the ashes and taken for the Pandavas. Even an escape from evil can leave innocent victims behind.'}],
 hidimbiIntro:[
  {who:'narrator',text:'Deep in the forest, the exhausted Pandavas slept while Bhima kept watch. A rakshasa named Hidimba smelled them on the wind, and sent his sister Hidimbi to lure them in.'},
  {who:'hidimbi',text:'Mighty one, I was sent to trap you, but I cannot do it. My brother Hidimba is coming. Wake your family and run!'},
  {choice:true,prompt:'A rakshasi stands before Bhima. Does he believe her?',options:[
   {label:'Thank her. She risked her brother\u2019s anger to warn you.',short:'Trusted Hidimbi\u2019s warning',dharma:10,flag:'hidimbi',then:[{who:'hidimbi',text:'Then I will stand with you, son of the wind.'}]},
   {label:'Threaten her. Rakshasas cannot be trusted.',short:'Distrusted Hidimbi for her birth',dharma:-10,then:[{who:'hidimbi',text:'You judge me by my birth, as men always do. Still, he is coming.'}]}]},
  {who:'bhima',text:'Let them sleep. No demon will touch my family tonight.'},
  {lesson:'judge'}],
 hidimbaTaunt:[{who:'hidimba',text:'Sister! You betray your own blood for a human? I will eat him first, and then you!'},{who:'bhima',text:'Come, then. But you will fight me, not her.'}],
 hidimbaAfter:[{who:'narrator',text:'Bhima defeated Hidimba as dawn broke. Hidimbi asked to marry him, and Kunti gave her blessing. Their son, Ghatotkacha, would one day give his life for the Pandavas at Kurukshetra.'}],
 bakaIntro:[
  {panel:'ekachakra',title:'The Village of Ekachakra',text:'Disguised as poor Brahmins, the Pandavas lived quietly in Ekachakra, sheltered by a kind Brahmin family. One evening they found the family weeping. The rakshasa Bakasura ruled the forest, and each week a household had to send him a cart of food and one of its people to be eaten. Tomorrow was their turn.'},
  {who:'brahmin',text:'Who should go? My wife, my daughter, my little son? I cannot choose. I will go myself.'},
  {choice:true,prompt:'The family who gave you shelter is about to be destroyed.',options:[
   {label:'Go in their place. This is what strength is for.',short:'Took the Brahmin family\u2019s place',dharma:15,then:[{who:'kunti',text:'You speak as I hoped, Bhima. I have five sons; they have one. Go, and come back to me.'}]},
   {label:'Stay out of it. Our disguise must not be exposed.',short:'Hesitated to risk the disguise',dharma:-10,then:[{who:'kunti',text:'Bhima! Those who shelter us are family. Our safety means nothing if we let them die. Go.'},{who:'narrator',text:'In the Mahabharata it was Kunti who offered her son, and Bhima went gladly.'}]}]},
  {lesson:'protect'}],
 bakaTaunt:[{who:'narrator',text:'Bhima reached Bakasura\u2019s clearing with the cart and, before the demon could stop him, sat down and began to eat the entire feast.'},{who:'baka',text:'WHO DARES EAT MY FOOD?'},{who:'bhima',text:'Delicious. You can have the empty cart, demon.'}],
 bakaAfter:[{who:'narrator',text:'Bhima broke Bakasura\u2019s back and dragged his body to the village gate at dawn. The people of Ekachakra never had to send anyone into the forest again.'}],
 ch3intro:[
  {panel:'swayam',title:'The Swayamvara of Draupadi',text:'King Drupada of Panchala announced a swayamvara for his daughter Draupadi. High above the hall a golden fish turned on a spinning wheel. Whoever could string the great bow and pierce the fish\u2019s eye, looking only at its reflection in a pool below, would win her hand.'},
  {who:'narrator',text:'King after king failed even to string the bow. Then Karna rose, strung it in a moment, and aimed. Draupadi spoke out: she would not marry a charioteer\u2019s son. Karna looked up at the sun, and set the bow down.'},
  {choice:true,prompt:'Arjuna, disguised as a poor Brahmin, watches Karna walk back to his seat.',options:[
   {label:'Feel his humiliation. No one should be shamed for their birth.',short:'Felt for Karna\u2019s humiliation',dharma:5,then:[]},
   {label:'Feel relief. Your greatest rival is out of the contest.',short:'Was relieved at Karna\u2019s rejection',dharma:-5,then:[]}]},
  {lesson:'birth'},
  {who:'arjuna',text:'Now it is my turn. No crown, no army, no name. Only the bow.'}],
 fishwin:[{who:'narrator',text:'The arrow flew up through the wheel and struck the fish\u2019s eye. The hall fell silent. Draupadi walked forward and placed her garland around the neck of the unknown Brahmin.'},{who:'narrator',text:'The kings were outraged. A Brahmin, winning a princess at a contest of warriors? They drew their swords.'},{lesson:'reflection'}],
 karnaTaunt:[{who:'karna',text:'Who are you, Brahmin, who shoots like a god? Let us see if you can stand against me.'},{who:'arjuna',text:'A student of a good teacher. Draw, if you wish.'}],
 karnaAfter:[{who:'karna',text:'Enough. I will not fight a Brahmin, and I am no longer sure you are one. We will meet again, archer.'},{who:'narrator',text:'They would meet again at Kurukshetra, neither knowing that they were brothers.'}],
 ch3end:[{panel:'indra',title:'Indraprastha',text:'Arriving home, the brothers called to Kunti that they had brought back a prize. Without looking, she told them to share it equally. Her word could not be taken back, and Draupadi became the wife of all five brothers. Soon after, the Pandavas were given a barren land called Khandavaprastha. With Krishna\u2019s help and the genius of the architect Maya, they built a shining city there: Indraprastha.'},{lesson:'indra'}]});

 {title:'The Strength That Protects',story:'When Ekachakra had to send a person to Bakasura, the Brahmin family who sheltered the Pandavas wept over who should go. Kunti said: I have five sons; let one of them go. Bhima went gladly, ate the demon\u2019s feast, and freed the village.',lesson:'Strength is given to protect, not to dominate. Duryodhana used his power to burn his cousins; Bhima used his to save strangers. The same strength, two opposite dharmas.',gita:6,reflect:'Who around you is carrying a burden you have the strength to share?'},

Object.assign(LESSONS,{
 jara:{title:'Strength Guided by Wisdom',src:'Sabha Parva, Girivraja',text:'Bhima\u2019s strength alone could not end Jarasandha; it took Krishna\u2019s insight to show how. Power without understanding fights the same battle forever.'},
 hundred:{title:'The Hundredth Insult',src:'Sabha Parva, the Rajasuya',text:'Krishna forgave insult after insult because he had given his word. Patience is strength, but it has a limit, and someone who keeps choosing harm will one day reach it.'},
 laughter:{title:'The Cost of Laughter',src:'Sabha Parva, Maya\u2019s hall',text:'A moment of mockery in a beautiful hall turned Duryodhana\u2019s envy into hatred, and he planned the dice game to avenge it. Laughter at someone\u2019s fall can cost more than any sword.'},
 dice:{title:'The Game That Cannot Be Won',src:'Sabha Parva, the dice game',text:'Shakuni\u2019s dice obeyed him, and the only winning move was to stop. Pride and the fear of seeming weak led a good king to lose everything, even what was never his to stake.'},
 silence:{title:'The Silence of the Elders',src:'Sabha Parva, the dice hall',text:'Bhishma, Drona and the wisest men of the age stayed silent while Draupadi was humiliated. Silence in the face of injustice is not neutral. It is a choice, and it helps the one doing wrong.'},
 kirata:{title:'The Hunter in the Snow',src:'Vana Parva, the Himalayas',text:'Arjuna\u2019s pride in his skill met a hunter it could not defeat. Only when he turned from fighting to worship did he see who stood before him. The greatest gifts come after pride is humbled.'},
 hanuman:{title:'The Old Monkey\u2019s Tail',src:'Vana Parva, the banana grove',text:'The strongest man alive could not lift an old monkey\u2019s tail. Hanuman taught Bhima that strength is a gift for protecting others, never a licence to push the weak aside.'},
 yaksha:{title:'The Yaksha\u2019s Questions',src:'Vana Parva, the enchanted lake',text:'Yudhishthira chose his stepbrother over his mightiest brothers, so that both of his father\u2019s wives would have a living son. Dharma is fairness, even when unfairness would serve you better.'},
 disguise:{title:'The Curse That Became a Gift',src:'Virata Parva, the court of Virata',text:'Urvashi\u2019s curse once seemed a disaster for Arjuna. In the year of disguise it became his perfect hiding place. What looks like misfortune may be preparing you for something.'},
 kichaka:{title:'The Court That Looked Away',src:'Virata Parva, Kichaka',text:'King Virata saw Kichaka strike Sairandhri and did nothing, because Kichaka was powerful. A ruler who will not protect the weakest person in the room has stopped ruling. Courage may wait for the right moment, but it must come.'},
 shami:{title:'The Weapons in the Shami Tree',src:'Virata Parva, the cattle raid',text:'Arjuna\u2019s greatest weapon stayed hidden for a whole year, waiting for the right moment. Families in India still honour the shami tree on Vijayadashami. Patience is not weakness; it is strength that knows when to wait.'},
 sammohana:{title:'Mercy on the Battlefield',src:'Virata Parva, the sleeping army',text:'With the whole Kaurava army asleep at his feet, Arjuna took only their cloths. The power to destroy is proven most by the choice not to use it.'}});

function riddle(prompt,opts,correct){const n={choice:true,prompt,options:[]};n.options=opts.map((o,i)=>i===correct?{label:o,dharma:0,then:[{who:'yaksha',text:'That is the answer.'}]}:{label:o,dharma:0,then:[{who:'yaksha',text:'That is not the answer. Think again, son of Dharma.'},n]});return n;}
const STAKES=['the pearls and gold of Indraprastha','your chariots and horses','your armies','the kingdom of Indraprastha itself','your brothers, one by one','yourself'];
function diceNode(k){if(k>=STAKES.length)return{choice:true,prompt:'Yudhishthira has lost everything, even himself. Shakuni leans forward: \u201cYou still have one treasure left. Draupadi.\u201d',options:[
  {label:'Stake Draupadi.',short:'Staked Draupadi at the dice',dharma:-15,then:[{panel:'dice',title:'The Last Throw',text:'Shakuni threw the dice and cried out, \u201cI win!\u201d A gasp ran around the hall. This is what Yudhishthira did in the Mahabharata.'}]},
  {label:'Refuse. She is not yours to stake.',short:'Refused to stake Draupadi',dharma:15,then:[{who:'narrator',text:'You chose differently from the epic. In the Mahabharata, Yudhishthira staked Draupadi too, and lost.'}]}]};
 return{choice:true,prompt:k===0?'Shakuni rattles the dice: \u201cWhat will you stake, King Yudhishthira?\u201d':'Shakuni smiles: \u201cAnother throw? Surely a king does not run from a game.\u201d',options:[
  {label:'Stake '+STAKES[k]+'.',dharma:0,then:[{panel:'dice',title:'Throw '+(k+1),text:'Shakuni threw the dice and cried, \u201cI win!\u201d Yudhishthira lost '+STAKES[k].replace('your ','his ').replace('yourself','himself')+'.'},diceNode(k+1)]},
  {label:'Rise from the board and walk away.',short:'Walked away from the dice',dharma:k<2?15:10,then:[{who:'narrator',text:'You chose differently from the epic. In the Mahabharata, Yudhishthira could not refuse a challenge, and he could not stop. He lost everything, then staked himself, and then Draupadi.'}]}]};}
Object.assign(SCRIPTS,{
 ch4intro:[{panel:'magadha',title:'The Emperor of Magadha',text:'Yudhishthira wished to perform the Rajasuya, the great sacrifice of an emperor. But Jarasandha of Magadha held eighty-six kings captive, meaning to sacrifice them. No army had ever broken him. He had been born in two halves, joined together by a rakshasi named Jara.'},
  {who:'krishna',text:'Armies will not win this. Bhima, Arjuna, come with me to Girivraja dressed as Brahmins. We will ask him for a single duel, and he will not refuse.'}],
 jaraTaunt:[{who:'narrator',text:'At Girivraja, Krishna revealed who they were. Jarasandha chose to fight the strongest of them: Bhima.'},{who:'jara',text:'A cook\u2019s appetite and a wrestler\u2019s arms. Let us see if you are worth breaking.'},{who:'krishna',text:'He keeps kings in chains like animals. Free them, Bhima.'}],
 jaraAfter:[{who:'narrator',text:'They wrestled for days. At last Krishna picked up a blade of grass, split it, and threw the halves in opposite directions. Bhima understood. He split Jarasandha and flung the halves apart, so they could never join again.'},{who:'narrator',text:'The eighty-six kings walked free. Jarasandha\u2019s son was crowned king of Magadha, and the freed kings gladly came to Yudhishthira\u2019s sacrifice.'},{lesson:'jara'}],
 rajasuya:[{panel:'chakra',title:'The Hundredth Insult',text:'At the Rajasuya, Yudhishthira honoured Krishna first among all the guests. King Shishupala rose and insulted Krishna again and again. Krishna had promised Shishupala\u2019s mother to forgive a hundred offences, and he counted them, silent and patient. At the hundred and first, his spinning discus ended it.'},{lesson:'hundred'},
  {panel:'maya',title:'The Hall of Illusions',text:'The architect Maya had built the Pandavas an assembly hall full of wonders: floors that looked like water, and water that looked like floor. Staying on after the sacrifice, Duryodhana stepped onto a crystal pool and fell in. Bhima and the servants burst out laughing.'},
  {choice:true,prompt:'Duryodhana stands dripping in the hall, his face burning. Everyone is laughing.',options:[
   {label:'Laugh with the others. He has mocked you for years.',short:'Laughed at Duryodhana in the hall',dharma:-10,then:[{who:'duryo',text:'Laugh, then. You will pay for every breath of it.'}]},
   {label:'Hand him a dry cloth and quietly guide him out.',short:'Helped Duryodhana save face',dharma:10,then:[{who:'duryo',text:'I need nothing from you.'},{who:'narrator',text:'You chose differently from the epic. There, the laughter echoed, and Duryodhana carried it home like a wound.'}]}]},
  {lesson:'laughter'}],
 dice:[{panel:'dice',title:'The Invitation',text:'Burning from his humiliation in Maya\u2019s hall, Duryodhana invited Yudhishthira to a friendly game of dice. Yudhishthira loved the game but played it poorly, and across the board sat Duryodhana\u2019s uncle Shakuni, whose dice obeyed him.'},
  {who:'shakuni',text:'Just a friendly game, cousin. I will throw on behalf of my nephew.'},diceNode(0),
  {panel:'hall',title:'The Question in the Hall',text:'Dushasana dragged Draupadi into the assembly. Standing before the elders, she asked one question: had Yudhishthira lost himself before he staked her? If he was no longer free, how could he wager her? Bhishma, Drona and the blind king looked at the floor.'},
  {ifFlag:'vikarna',then:[{who:'narrator',text:'Then a young Kaurava rose: Vikarna, the cadet you once helped out of the dust. \u201cShe is right,\u201d he said. \u201cThis game was unjust.\u201d Karna shouted him down.'}],elseThen:[{who:'vikarna',text:'She is right. This game was unjust from the start. Will none of you elders say so?'},{who:'narrator',text:'Karna shouted him down, and the elders stayed silent.'}]},
  {choice:true,prompt:'The elders look at the floor. If you stood in that hall, what would you do?',options:[
   {label:'Stand beside Vikarna and say it aloud: this is wrong.',short:'Spoke up in the dice hall',dharma:10,then:[]},
   {label:'Stay silent. It is not your place to oppose the king.',short:'Stayed silent in the dice hall',dharma:-10,then:[{who:'narrator',text:'That was the choice of nearly everyone in the hall, including the wisest men of the age.'}]}]},
  {panel:'cloth',title:'The Endless Cloth',text:'Dushasana seized the end of Draupadi\u2019s sari to shame her before the court. She raised her hands and called out to Krishna. As Dushasana pulled, the cloth kept coming, length after length, until he fell back exhausted and the hall went silent with awe.'},
  {who:'bhima',text:'Hear me, all of you! One day I will break the thigh of Duryodhana, and Dushasana will answer for this with his life. This is my vow.'},
  {who:'narrator',text:'Frightened by evil omens, the blind king returned everything to the Pandavas. But Duryodhana insisted on one more game, and again Yudhishthira lost. The Pandavas and Draupadi were sent into the forest for twelve years, and a thirteenth in which they must not be recognised.'},
  {lesson:'silence'},{lesson:'dice'}],
 ch5intro:[{panel:'exile',title:'Twelve Years in the Forest',text:'The Pandavas went into exile with Draupadi, living on roots and fruit. Krishna came to see them and promised that the day of justice would come. The sage Vyasa told Arjuna to seek the weapons of the gods, for the war ahead would need them.'},{who:'arjuna',text:'Then I will go north, to the Himalayas, and pray to Shiva himself.'},{who:'narrator',text:'As Arjuna meditated in the snow, demons came for him, and then a monstrous boar.'}],
 kirataTaunt:[{who:'narrator',text:'Arjuna\u2019s arrow struck the boar at the very moment another arrow did. A wild mountain hunter, a Kirata, strode out of the trees.'},{who:'kirata',text:'That boar was mine. I shot it first. Do princes of the cities not know the law of the hunt?'},
  {choice:true,prompt:'The hunter blocks your way. Arjuna has fasted for months, and his temper is short.',options:[
   {label:'\u201cIt was my arrow. Step aside, or fight me.\u201d',short:'Challenged the hunter in pride',dharma:-5,then:[{who:'kirata',text:'Gladly, archer.'},{who:'narrator',text:'This is what Arjuna did in the epic.'}]},
   {label:'\u201cPerhaps we struck together. Shall we test our skill fairly?\u201d',short:'Offered the hunter a fair contest',dharma:5,then:[{who:'kirata',text:'Fairly, then. Show me what the gods should see in you.'},{who:'narrator',text:'You chose a gentler path. In the epic, Arjuna, proud of his skill, challenged the hunter at once.'}]}]}],
 kirataAfter:[{panel:'shiva',title:'The Hunter Revealed',text:'Arjuna\u2019s arrows vanished into the hunter\u2019s body, and even his bare hands could not move him. Exhausted, he made a garland and offered it to a clay image of Shiva, and saw the garland appear around the hunter\u2019s neck. The Kirata was Shiva himself, with Parvati beside him.'},
  {who:'kirata',text:'I am pleased with you, Arjuna. Your courage held even when your pride was broken. Take the Pashupata, my own weapon. But never use it against anyone weaker than you.'},{lesson:'kirata'}],
 tailq:[{panel:'grove',title:'The Banana Grove',text:'Draupadi found a golden lotus drifting on the wind and asked Bhima to bring her more. He crashed up the mountain through a grove of banana trees, until he found an old monkey lying across the path, its long tail blocking the way.'},
  {who:'bhima',text:'Move your tail, old one. I am in a hurry.'},{who:'hanuman',text:'I am too old and sick to move, child. If you must pass, lift it aside yourself.'},
  {choice:true,prompt:'The old monkey closes his eyes again.',options:[
   {label:'Shove it aside. You are the strongest man alive.',short:'Treated the old monkey with contempt',dharma:-10,then:[]},
   {label:'Bow, apologise for your rudeness, and ask his leave to lift it.',short:'Showed respect to an old stranger',dharma:10,then:[{who:'hanuman',text:'Good manners, at least. Go on, then. Lift it.'}]}]}],
 tailwin:[{who:'bhima',text:'I... cannot move it. Not even an inch. Who are you?'},{panel:'hanuman',title:'The Elder Brother',text:'The old monkey smiled, and grew, and grew, until he filled the sky. He was Hanuman, servant of Rama and son of the wind god, which made him Bhima\u2019s own elder brother. He embraced Bhima and promised to ride on the flag of Arjuna\u2019s chariot in the war to come.'},
  {who:'hanuman',text:'Strength is a gift, little brother, not a reason for pride. Protect the weak, and bow to the old.'},{lesson:'hanuman'}],
 yaksha:[{panel:'lake',title:'The Lake of the Yaksha',text:'Late in the exile the brothers grew desperate with thirst. Sahadeva found a clear lake guarded by a crane. \u201cAnswer my questions before you drink,\u201d it said. He ignored it, drank, and fell senseless. So did Nakula, Arjuna and Bhima. Then Yudhishthira came to the shore.'},
  {who:'yaksha',text:'I am the Yaksha of this lake. Your brothers would not listen. Answer my questions, son of Dharma, and you may drink.'},
  riddle('What is heavier than the earth, and what is higher than the sky?',['A mountain, and the stars.','Gold, and the gods.','A mother, and a father.'],2),
  riddle('What is faster than the wind?',['A falcon in flight.','The mind.','Time itself.'],1),
  riddle('What is it that, once given up, makes a person loved?',['Wealth.','Desire.','Pride.'],2),
  riddle('What is the greatest wonder in the world?',['The Himalayas, touching the sky.','That every day people die, yet the living act as if they will live forever.','The birth of a child.'],1),
  {who:'yaksha',text:'You have answered well. I will bring back one of your brothers. Choose which one.'},
  (()=>{const n={choice:true,prompt:'Four brothers lie on the shore. Only one may rise.',options:[]};n.options=[
   {label:'Bhima, whose strength will win the war.',dharma:0,then:[{who:'yaksha',text:'Strength? And leave your father\u2019s second wife with no son at all? Think again.'},n]},
   {label:'Arjuna, the greatest archer alive.',dharma:0,then:[{who:'yaksha',text:'Skill? And leave your father\u2019s second wife with no son at all? Think again.'},n]},
   {label:'Nakula, so that Madri, my father\u2019s second wife, also has a living son.',short:'Chose Nakula, out of fairness',dharma:15,then:[]}];return n;})(),
  {who:'yaksha',text:'You chose fairness over your own advantage. I am Dharma, your father, and I was testing you. All your brothers will live.'},{lesson:'yaksha'}],
 ch6intro:[{panel:'disguise',title:'The Thirteenth Year',text:'For the final year the Pandavas had to live unrecognised, or begin the exile all over again. They entered King Virata\u2019s court in disguise: Yudhishthira as a dice-playing courtier, Bhima as the cook Ballava, Nakula as a horse-keeper, Sahadeva as a cowherd, and Draupadi as the queen\u2019s maid, Sairandhri.'},
  {who:'narrator',text:'Arjuna became Brihannala, a dance teacher to the princess. Years before, the celestial dancer Urvashi had cursed him to live a year as neither man nor woman. Now the curse became the perfect disguise.'},{lesson:'disguise'},
  {who:'narrator',text:'But Kichaka, the queen\u2019s powerful brother and commander of Virata\u2019s army, would not leave Sairandhri alone. He followed her, ignored every refusal, and finally struck her in front of the whole court. King Virata, afraid of him, said nothing.'},
  {who:'draupadi',text:'Ballava. The king will not protect me, and Yudhishthira tells me to be patient. I am asking you.'},
  {choice:true,prompt:'If Bhima is recognised, all five brothers must begin twelve more years of exile.',options:[
   {label:'Storm into the court right now and fight Kichaka in front of everyone.',short:'Rushed to act in the open court',dharma:-5,then:[{who:'yudhi',text:'Ballava! The cook is needed in the kitchen. Now.'},{who:'narrator',text:'Yudhishthira stopped Bhima with a look. One rash act would have cost them everything.'}]},
   {label:'Have her ask Kichaka to the dance hall tonight. You will be waiting instead.',short:'Planned to face Kichaka in secret',dharma:10,then:[]}]},
  {who:'bhima',text:'Tell him to come to the dance hall after dark. He will find someone waiting for him.'}],
 kichakaTaunt:[{who:'narrator',text:'In the darkness of the dance hall, Kichaka reached for the figure waiting on the couch. It was not Sairandhri.'},{who:'kichaka',text:'The cook? You dare lay a hand on me?'},{who:'bhima',text:'You struck a woman in front of a king who was too afraid to stop you. I am not afraid.'}],
 kichakaAfter:[{who:'narrator',text:'By morning Kichaka was dead, and no one could say who had done it. When his brothers tried to burn Sairandhri on his funeral pyre, a giant of a man tore up a tree and scattered them. The city whispered that she was protected by gandharvas.'},{lesson:'kichaka'}],
 uttara:[{panel:'raid',title:'The Cattle Raid',text:'Hearing that Kichaka was dead, the Kauravas guessed the Pandavas were hiding in Virata, and raided its cattle to draw them out. Only young Prince Uttara was left to defend the city. He boasted that he would win alone, if only he had a charioteer.'},
  {who:'draupadi',text:'Brihannala once drove Arjuna\u2019s own chariot. Take her.'},
  {who:'narrator',text:'The prince laughed, then agreed. But when Uttara saw the Kaurava army, with Bhishma, Drona, Karna and Duryodhana at its head, he leapt from the chariot and ran.'},
  {choice:true,prompt:'The terrified prince is running away across the field.',options:[
   {label:'Catch him and calm him. You will fight; he only has to drive.',short:'Gave Uttara courage instead of contempt',dharma:10,then:[]},
   {label:'Mock his cowardice in front of the army.',short:'Mocked the frightened prince',dharma:-10,then:[{who:'uttara',text:'Laugh if you like! I am only a boy!'}]}]},
  {panel:'shami',title:'The Shami Tree',text:'Brihannala drove Uttara to a great shami tree where the Pandavas had hidden their weapons, wrapped like a corpse so no one would touch them. Arjuna took down the Gandiva, told the astonished prince who he really was, and blew his conch, Devadatta.'},{lesson:'shami'}],
 karna2Taunt:[{who:'karna',text:'So the dance teacher is Arjuna after all. I have waited a long time for this.'},{who:'arjuna',text:'Then stop waiting.'}],
 sammohana:[{who:'narrator',text:'Arjuna drove back Karna, then Drona, Ashwatthama and Kripa one after another. At last he raised the Gandiva and released the Sammohanastra, the weapon of stupefaction.'},
  {panel:'sleep',title:'The Sleeping Army',text:'The whole Kaurava army fell into a deep sleep on the field. Arjuna sent Uttara to gather the warriors\u2019 bright upper cloths as gifts for his sister\u2019s dolls. Only Bhishma, who knew the counter-spell, had stayed awake. He smiled at his grandson and let him go.'},
  {who:'narrator',text:'Arjuna could have killed every one of them as they slept. He did not. A warrior does not strike those who cannot defend themselves.'},{lesson:'sammohana'}],
 ch6end:[{panel:'wedding',title:'Revealed',text:'The year was over. The Pandavas revealed themselves to King Virata, who begged their forgiveness. His daughter Uttaraa was married to Abhimanyu, the young son of Arjuna and Subhadra. Now the Pandavas could ask for their kingdom back. Whether they would get it was another matter.'}]});

Object.assign(SCRIPTS,{
 ch7intro:[{panel:'dwaraka',title:'At Krishna\u2019s Feet',text:'With war looming, both Arjuna and Duryodhana rode to Dwaraka to ask Krishna for help, and found him asleep. Duryodhana sat proudly at the head of the bed; Arjuna sat humbly at his feet. When Krishna woke, the first person he saw was Arjuna.'},

  {who:'narrator',text:'Parashurama ordered Bhishma to marry Amba. Bhishma refused, because of his vow. So the teacher challenged his student to battle, on the very field of Kurukshetra.'}],

  {panel:'cosmic',title:'The Form That Cannot Be Bound',text:'Duryodhana ordered his men to seize Krishna. Krishna laughed, and the whole court saw gods, heroes and worlds blazing within him. The blind king was given sight for a moment so that he too could see. Then Krishna walked out, and no one dared to touch him.'},{lesson:'peace'}],
 kunti:[{panel:'river',title:'By the River',text:'Before he left, Krishna told Karna the secret of his birth: he was Kunti\u2019s firstborn, the son of the sun god, set adrift on a river in a basket before she was married. He was the eldest Pandava, and the throne could be his.'},

  {who:'karna',text:'But I give you this, mother. I will not kill Yudhishthira, Bhima, Nakula or Sahadeva. Only Arjuna and I will fight to the death. Either way, you will still have five sons.'},{lesson:'karnaLoyal'}],
 ch8intro:[{panel:'armies',title:'Dharmakshetra, Kurukshetra',text:'Eighteen armies gathered on the plain of Kurukshetra, seven for the Pandavas and eleven for the Kauravas. In Hastinapura the sage Vyasa gave Sanjaya divine sight, so that he could tell the blind king everything. The Gita begins with the king\u2019s question: on the field of dharma, the field of the Kurus, what did my sons and the Pandavas do?'},

 {title:'The Last Road to Peace',story:'Arjuna chose an unarmed friend over an army. Krishna begged for five villages and was refused. Kunti told Karna the truth, and he chose loyalty anyway. Everyone in this chapter was offered a choice, and the war was built out of their answers.',lesson:'War is never one decision. It is a thousand small refusals: to share, to forgive, to admit a wrong. Peace needs everyone; war needs only a few.',gita:13,reflect:'Is there a \u201cfive villages\u201d in your life: a small thing you could give that would prevent a much larger fight?'},
 {title:'The Song on the Battlefield',story:'Between two armies, the greatest archer alive dropped his bow and wept. Krishna did not shame him or command him. He taught him who he truly was, what action and duty mean, and how to stay steady. Then he said: reflect, and choose.',lesson:'The Gita does not ask you to stop feeling. It asks you to act rightly while feeling, without being ruled by fear, greed or the hunger for reward.',gita:0,reflect:'What duty in front of you have you been avoiding, and what would it mean to do it without worrying about the result?'});

Object.assign(LESSONS,{
 chakravyuha:{title:'The Boy in the Wheel',src:'Drona Parva, the thirteenth day',text:'Abhimanyu went in knowing only how to enter. Seven warriors broke every rule of war to bring down one boy. Half-knowledge is dangerous, but the deeper shame belongs to those who abandon dharma because they are afraid of losing.'},
 oath:{title:'An Oath Sworn in Grief',src:'Drona Parva, the night of mourning',text:'Arjuna\u2019s oath, made in the fire of grief, nearly cost him his life and drew Krishna into deception to save him. Strong feelings make strong promises. Be careful what you swear while you are burning.'},
 ghatotkacha:{title:'Ghatotkacha\u2019s Sacrifice',src:'Drona Parva, the night battle',text:'The son of a rakshasi and a Pandava, a child some would have judged by his birth, gave his life and saved Arjuna\u2019s. Greatness comes from the places we least expect.'},
 half:{title:'The Half-Truth',src:'Drona Parva, the fifteenth day',text:'Yudhishthira never lied, until he spoke words that were technically true and meant to deceive. A half-truth told to mislead is a lie wearing the clothes of honesty, and even the most righteous person pays for it.'},
 revenge:{title:'The Vow of Revenge',src:'Karna Parva, Bhima and Dushasana',text:'Bhima\u2019s vow was born from a real and terrible wrong. Keeping it brought no healing, only a horror his own friends could not look at. Justice repairs; revenge only repeats.'},
 karnaEnd:{title:'The Sinking Wheel',src:'Karna Parva, the seventeenth day',text:'Karna asked for the dharma he had denied others, and Arjuna struck him while his wheel was stuck. The epic does not say who was right. By the end of a war built on wrongs, no side has clean hands.'}});

Object.assign(SCRIPTS,{
 ch9intro:[{panel:'formation',title:'The Wheel Formation',text:'After Bhishma fell, Drona took command of the Kaurava army and swore to capture Yudhishthira. On the thirteenth day, warriors sworn to fight to the death lured Arjuna away to the far end of the field. Then Drona arranged his army into the Chakravyuha: a vast, turning wheel of soldiers that only Arjuna and Krishna knew how to break.'},
  {who:'yudhi',text:'Without Arjuna, none of us can get in. Abhimanyu, your father taught you, did he not?'},
  {who:'abhimanyu',text:'He explained to my mother how to break into the wheel while I was still in her womb. She fell asleep before he told her how to get out. I know only half.'},
  {who:'bhima',text:'Break in, nephew, and we will be right behind you. We will bring you out.'},
  {who:'narrator',text:'Abhimanyu was sixteen years old.'}],
 abhiFall:[{who:'narrator',text:'Behind Abhimanyu, Jayadratha closed the gap in the wheel and held back every Pandava who tried to follow. Inside, seven great warriors surrounded one boy at once, against every rule of war. Abhimanyu fought on with a chariot wheel until it broke in his hands.'},
  {panel:'abhi',title:'The Boy in the Wheel',text:'He fell at last, fighting, surrounded on every side. Even some of the Kaurava warriors could not bear to watch. That evening, the Pandava camp was silent.'},{lesson:'chakravyuha'}],
 oath:[{who:'narrator',text:'Arjuna returned from the far end of the field to find his son dead, and learned that Jayadratha had held the gate.'},
  {choice:true,prompt:'Arjuna\u2019s grief is turning into rage.',options:[
   {label:'Swear it before everyone: \u201cIf Jayadratha lives past sunset tomorrow, I will walk into the fire.\u201d',short:'Swore the oath against Jayadratha',dharma:0,then:[{who:'narrator',text:'This is the oath Arjuna swore. Krishna said nothing, but he did not sleep that night.'}]},
   {label:'Grieve first. Make no vow in the heat of anger.',short:'Refused to make a vow in anger',dharma:5,then:[{who:'narrator',text:'A wise choice. But in the epic Arjuna swore the oath that night, and the whole next day turned on it.'}]}]},
  {lesson:'oath'}],
 sunsetTaunt:[{who:'narrator',text:'The Kauravas had hidden Jayadratha behind an entire army, and the sun was sinking fast.'},
  {panel:'eclipse',title:'Krishna\u2019s Darkness',text:'Krishna raised his discus and covered the sun. Darkness fell over the field. Believing the day was over and Arjuna had failed, the Kauravas cheered, and Jayadratha stepped out from behind his guards to watch Arjuna walk into the fire.'},
  {who:'krishna',text:'The sun has not set, Arjuna. Look!'},{fn:()=>{game.flashT=0.8;}},{who:'jayadratha',text:'No... the sun!'}],
 sunsetAfter:[{who:'narrator',text:'The light returned, and Arjuna\u2019s arrow found Jayadratha before the sun went down. The oath was kept.'},{who:'narrator',text:'But the war had changed. From that night on the armies fought even in the dark, and the old rules of war began to fall away one by one.'}],
 nightwar:[{panel:'ghatotkacha',title:'Ghatotkacha\u2019s Night',text:'That night the battle went on by torchlight. Ghatotkacha, son of Bhima and Hidimbi, grew to the size of a mountain and crushed the Kaurava ranks. In desperation Karna hurled the Shakti, the divine spear he had saved for Arjuna. Ghatotkacha fell, and with his last strength he fell upon the Kaurava army.'},
  {ifFlag:'hidimbi',then:[{who:'narrator',text:'He was the son of the rakshasi you once chose to trust in the dark forest.'}]},
  {who:'krishna',text:'Weep for him, Bhima, and honour him. His death has saved Arjuna\u2019s life. Karna has no Shakti left.'},{lesson:'ghatotkacha'}],
 dronaTaunt:[{who:'drona',text:'Show me what I taught you, Arjuna.'},{who:'arjuna',text:'Everything I am, I owe to you, Guru. Forgive me.'}],
 dronaAfter:[{who:'narrator',text:'Teacher and student fought to a standstill. As long as Drona held his bow, no one on the field could defeat him.'}],
 halftruth:[{panel:'elephant',title:'Ashwatthama Is Dead',text:'Krishna proposed a plan. Bhima killed an elephant named Ashwatthama, the same name as Drona\u2019s beloved son, and shouted that Ashwatthama was dead. Drona did not believe it. He turned to the one man who had never told a lie: Yudhishthira.'},
  {who:'drona',text:'Yudhishthira. Is it true? Is my son dead?'},
  {choice:true,prompt:'Krishna has told you the war depends on this. Drona is waiting.',options:[
   {label:'Say it plainly: \u201cAshwatthama the elephant is dead.\u201d',short:'Told Drona the whole truth',dharma:10,then:[{who:'narrator',text:'You chose differently from the epic. In the Mahabharata, Yudhishthira gave in to the plan.'}]},
   {label:'Say aloud \u201cAshwatthama is dead,\u201d and whisper \u201cthe elephant.\u201d',short:'Told Drona a half-truth',dharma:-10,then:[{who:'narrator',text:'This is what Yudhishthira did. Krishna had the conches blown so loudly that Drona never heard the last words.'}]}]},
  {who:'narrator',text:'All his life, Yudhishthira\u2019s chariot had floated a hand\u2019s breadth above the ground, so pure was his truthfulness. At that moment it sank down and touched the earth.'},
  {panel:'meditate',title:'The Teacher Lays Down His Bow',text:'Drona dropped his weapons, sat down in his chariot, and turned his mind inward. Dhrishtadyumna, born to kill him, struck while he sat in meditation. Arjuna cried out to stop him, too late.'},{lesson:'half'}],
 ch10intro:[{panel:'shalya',title:'Karna Takes Command',text:'With Drona gone, Karna at last commanded the Kaurava army. Duryodhana persuaded King Shalya to drive his chariot. But Shalya had secretly promised the Pandavas to weaken Karna\u2019s spirit, and he mocked him at every turn.'},
  {who:'narrator',text:'Two old curses hung over Karna. His teacher Parashurama, discovering that Karna had lied about his birth to learn from him, had cursed him to forget his greatest weapon when he needed it most. And a Brahmin whose cow he had once killed by accident had cursed his chariot wheel to sink in his last battle.'},
  {who:'narrator',text:'But first, Bhima went looking for Dushasana.'}],
 dushTaunt:[{who:'bhima',text:'Dushasana! Do you remember the dice hall? I made a vow there.'},{who:'dushasana',text:'I remember. Come and keep it, if you can.'}],
 dushAfter:[{who:'narrator',text:'Bhima fulfilled the terrible vow he had made in the dice hall, and the field fell silent at its savagery. Even his own allies turned their eyes away. The vow was kept, but nothing that had been broken was mended.'},{lesson:'revenge'}],
 karna3Taunt:[{who:'karna',text:'At last, Arjuna. No tournament, no swayamvara, no cattle raid. Today one of us will not leave this field.'},{who:'arjuna',text:'Then let it be fought well.'}],
 karna3After:[{panel:'wheel',title:'The Sinking Wheel',text:'Then the Brahmin\u2019s curse came true. The left wheel of Karna\u2019s chariot sank into the earth. Karna leapt down and strained to lift it out.'},
  {who:'karna',text:'Wait, Arjuna! A warrior does not strike a man whose wheel is stuck. Remember dharma!'},
  {who:'krishna',text:'Dharma, Karna? Where was your dharma when Draupadi was dragged into the hall? When seven of you surrounded a boy of sixteen?'},
  {choice:true,prompt:'Karna is struggling with the wheel. Krishna tells you to strike.',options:[
   {label:'Strike, as Krishna says. Karna has set dharma aside whenever it suited him.',short:'Struck Karna as his wheel sank',dharma:0,then:[{who:'narrator',text:'This is what Arjuna did. Even the epic does not pretend it was simple.'}]},
   {label:'Lower your bow and wait for him to free the wheel.',short:'Waited for Karna to free his wheel',dharma:0,then:[{who:'narrator',text:'You chose to wait. In the Mahabharata, urged by Krishna, Arjuna loosed his arrow while Karna struggled. The epic leaves us to wonder whether that was justice, or the war making everyone into something worse.'}]}]},
  {panel:'sunset',title:'The Fall of Karna',text:'Karna fell at sunset, and it seemed the sun, his father, dimmed with him. Only after the war did Kunti tell the Pandavas the truth: they had killed their own eldest brother. Yudhishthira wept, and said that if he had known, he would have given Karna the throne.'},{lesson:'karnaEnd'}]});

CH_SCROLLS.push(
 {title:'The Rules That Fell',story:'Seven warriors surrounded one boy. Krishna covered the sun to draw an enemy into the open. The most truthful man alive told a half-truth to bring down his own teacher. In these days, both sides learned that winning was easier once the rules were broken.',lesson:'Every rule broken in war is justified by the one broken before it. Adharma does not stay on one side of the battlefield; it spreads until no one is innocent.',gita:4,reflect:'When someone treats you unfairly, how do you keep from answering them with the same unfairness?'},
 {title:'Brothers at War',story:'Bhima kept a vow of revenge and found it brought no peace. Arjuna killed the brother he never knew he had, at the moment that brother was most helpless. Only afterwards did the Pandavas learn the truth, and the victory turned to ash.',lesson:'In a war between family, every victory is also a loss. The enemy you hate may be closer to you than you know.',gita:9,reflect:'Is there someone you think of as an enemy who might, from another angle, be family?'});

GITA.push(
 {ref:'Bhagavad Gita 2.27',text:'For one who is born, death is certain; for one who dies, birth is certain. Do not grieve over what cannot be avoided.',lesson:'Endings are part of every story, even the greatest.'},
 {ref:'Bhagavad Gita 18.78',text:'Wherever there is Krishna, lord of yoga, and wherever there is Arjuna the archer, there will be fortune, victory, prosperity and right conduct. This is my conviction.',lesson:'The last verse of the Gita: wisdom and effort, together.'});

Object.assign(LESSONS,{
 thigh:{title:'Below the Navel',src:'Shalya Parva, the mace duel',text:'Bhima won by breaking a rule of combat, and the heavens rained flowers on the man he defeated. The Mahabharata refuses easy answers: a righteous cause can still be served by an unrighteous act, and the epic wants you to feel the weight of both.'},
 restraint:{title:'The Weapon Withdrawn',src:'Sauptika Parva, the Brahmastras',text:'Arjuna could call back the weapon that could burn the world; Ashwatthama could not. Discipline is not the power to strike. It is the power to stop.'},
 mercy:{title:'Draupadi\u2019s Mercy',src:'Sauptika Parva, after the night raid',text:'Draupadi, who had lost every son, asked that their killer be spared so that his mother would not suffer as she did. Mercy from the one with the most reason for revenge is the hardest and greatest kind.'},
 grief:{title:'A Mother\u2019s Grief',src:'Stri Parva, the battlefield',text:'Gandhari had lost a hundred sons, and no argument about who began the war could reach her. Before grief, the wise do not defend themselves. They kneel and listen.'},
 rajadharma:{title:'The Duty of a King',src:'Shanti Parva, the bed of arrows',text:'Bhishma taught that a ruler must live for his people as a mother lives for the child she carries. Power is not a prize; it is a responsibility to those who cannot protect themselves.'},
 ahimsa:{title:'The Highest Dharma',src:'Anushasana Parva',text:'Non-violence is the highest dharma, and its heart is simple: do not do to others what you would not want done to you. After eighteen days of war, this was the lesson the dying grandsire chose to leave.'},
 time:{title:'Time Gives, Time Takes',src:'Mausala Parva, the end of the Yadavas',text:'Krishna\u2019s clan destroyed itself, Dwaraka sank into the sea, and Arjuna could no longer lift his bow. Every power, every city and every hero has its season. Act well while your season lasts.'},
 dog:{title:'The Faithful Dog',src:'Mahaprasthanika Parva, the road to heaven',text:'Yudhishthira would rather give up heaven than abandon a dog that had been faithful to him. Loyalty to the humble and powerless is the truest test of a good heart.'},
 heaven:{title:'The Last Test',src:'Svargarohana Parva, the end of the epic',text:'Offered heaven alone or hell with those he loved, Yudhishthira chose hell, and that choice turned it into heaven. The Mahabharata ends where it always pointed: compassion is the final dharma.'}});

const BT={
 king:{label:'\u201cWhat makes a good king, grandsire?\u201d',ans:[{who:'grandsire',text:'A king must live for his people as a mother lives for the child she carries, setting aside what pleases her for what is good for the child. A king who rules for himself has already lost his kingdom.'}]},
 dharma:{label:'\u201cWhat is the highest dharma?\u201d',ans:[{who:'grandsire',text:'Non-violence is the highest dharma. And this is the whole of it: do not do to others what you would not want done to yourself. Everything else is explanation.'},{lesson:'ahimsa'}]},
 death:{label:'\u201cHow should a person face death?\u201d',ans:[{who:'grandsire',text:'As I face it now: with my work finished, my debts paid, and no hatred left in me. Fear of death is only attachment wearing a frightening mask.'},{verse:27}]},
 names:{label:'\u201cBy which name should a person remember the Lord?\u201d',ans:[{who:'grandsire',text:'Remember him by a thousand names, for he is in everything.'},{who:'narrator',text:'Bhishma then recited the Vishnu Sahasranama, the thousand names of Vishnu, which people still chant today.'}]}};
function teachHub(rem){const asked=4-rem.length;const n={choice:true,prompt:asked===0?'The grandsire waits. What will Yudhishthira ask first?':'Bhishma\u2019s voice is growing faint. What else will you ask?',options:rem.map(k=>({label:BT[k].label,dharma:0,then:[...BT[k].ans,teachHub(rem.filter(x=>x!==k))]}))};const done={label:'\u201cRest now, grandsire.\u201d',dharma:0,then:[]};if(rem.length===0){n.options=[done];n.prompt='Yudhishthira has asked all he can.';}else if(asked>=2)n.options.push(done);return n;}
const FALLS={draupadi:[{who:'bhima',text:'Brother! Draupadi has fallen! She never did a wrong thing in her life. Why?'},{who:'yudhi',text:'She loved Arjuna more than the rest of us. That partiality was her only fault. Walk on, Bhima, and do not look back.'},
  {choice:true,prompt:'Draupadi lies in the snow behind you.',options:[{label:'Walk on, as Yudhishthira did.',short:'Walked on without looking back',dharma:0,then:[]},{label:'Turn back and kneel beside her for a moment.',short:'Turned back for Draupadi',dharma:0,then:[{who:'narrator',text:'You kneel, and the snow closes softly over her. In the epic Yudhishthira did not look back. This road, the story says, is walked alone in the end.'}]}]}],
 sahadeva:[{who:'bhima',text:'Sahadeva too!'},{who:'yudhi',text:'He believed no one was as wise as he was. Walk on.'}],
 nakula:[{who:'bhima',text:'Nakula!'},{who:'yudhi',text:'He believed no one was as handsome as he was. Walk on.'}],

Object.assign(SCRIPTS,{
 ch11intro:[{panel:'lake2',title:'The Last Kaurava',text:'On the eighteenth day Shalya fell to Yudhishthira\u2019s spear and Shakuni to Sahadeva. Of the hundred Kaurava brothers, only Duryodhana was left. Wounded and alone, he hid at the bottom of a lake, holding the water still with his magic. The Pandavas found him there.'},
  {who:'yudhi',text:'Come out, Duryodhana. Fight any one of us, with any weapon you choose. If you win, the kingdom is yours.'},
  {who:'krishna',text:'Yudhishthira! You have gambled everything again. If he chooses anyone but Bhima, we are lost.'},
  {who:'duryo',text:'I choose the mace. And I choose Bhima.'},
  {who:'narrator',text:'Balarama, Krishna\u2019s brother and the mace teacher of both men, arrived to watch his two students fight.'}],
 duelTaunt:[{who:'duryo',text:'I have nothing left, cook. No brothers, no army. Only this mace, and my hatred of you.'},{who:'bhima',text:'Then let us finish what began in the dice hall.'}],
 duelAfter:[{panel:'thigh',title:'Below the Navel',text:'Gandhari\u2019s gaze had made Duryodhana\u2019s body almost as hard as iron. Only his thighs were not. From the edge of the field, Krishna caught Bhima\u2019s eye and slapped his own thigh. But the rules of mace fighting forbid any blow below the navel.'},
  {choice:true,prompt:'Duryodhana raises his mace again. Krishna\u2019s signal is clear.',options:[
   {label:'Strike his thigh. Bhima vowed it in the dice hall.',short:'Struck Duryodhana\u2019s thigh',dharma:0,then:[{who:'narrator',text:'This is what Bhima did.'}]},
   {label:'Fight on by the rules, whatever it costs.',short:'Kept to the rules of the duel',dharma:5,then:[{who:'narrator',text:'You chose honour. In the epic, Bhima struck the thigh, fulfilling the vow he made in the dice hall.'}]}]},
  {who:'narrator',text:'Duryodhana fell. Balarama raised his plough in fury at the broken rule, and Krishna had to calm him.'},
  {who:'duryo',text:'I lived as a king, and I die as one, on the field, while you won by trickery. Which of you can say the same?'},
  {who:'narrator',text:'The epic says that the heavens rained flowers on the dying Duryodhana. Even the gods could not judge this war simply.'},{lesson:'thigh'}],
 raid:[{panel:'owl',title:'The Owl and the Crows',text:'That night Ashwatthama, Kripa and Kritavarma rested under a banyan tree. Ashwatthama watched an owl swoop down and kill crows as they slept in the branches, and a terrible idea took hold of him.'},
  {who:'kripa',text:'Attacking sleeping men is the act of a coward, Ashwatthama. It is against every law.'},{who:'ashwatthama',text:'They broke every law to kill my father. I owe them nothing.'},
  {panel:'camp',title:'The Night Raid',text:'Ashwatthama crept into the sleeping Pandava camp. He killed Dhrishtadyumna, who had slain his father, and then the five young sons of Draupadi as they slept. The Pandavas survived only because Krishna had led them away from the camp that night.'},
  {who:'narrator',text:'When Draupadi learned that all her sons were dead, she sat down on the ground and would not rise until their killer was found.'}],
 ashwaTaunt:[{who:'ashwatthama',text:'You have come for me, Arjuna? You, whose side killed my father with a lie?'},{who:'arjuna',text:'You killed children in their sleep. No lie is big enough to excuse that.'}],
 brahma:[{who:'ashwatthama',text:'Then let the whole world burn!'},

 ch12intro:[{panel:'women',title:'The Women of Kurukshetra',text:'When the war was over, the women of both sides came to the battlefield to find their husbands, sons and brothers. Among them was Gandhari, mother of the hundred Kauravas, who had worn a blindfold all her married life so that she would see no more than her blind husband.'},
  {who:'gandhari',text:'A hundred sons. Not one of them left to me. Could you not have spared even one, Yudhishthira?'},
  {choice:true,prompt:'A grieving mother stands before Yudhishthira, the man who won the war.',options:[

   {label:'Remind her gently that her sons began the war.',short:'Defended the war to Gandhari',dharma:-5,then:[{who:'gandhari',text:'Do you think a mother counts whose fault it was?'},{who:'narrator',text:'In the epic, Yudhishthira did not argue. He knelt and asked for her curse.'}]}]},
  {who:'gandhari',text:'Krishna. You could have stopped this, and you did not. As my family destroyed itself, so will yours, in thirty-six years.'},
  {who:'krishna',text:'I accept it, Mother.'},{lesson:'grief'}],
 bhishmaTeach:[{panel:'bed',title:'Teachings from the Bed of Arrows',text:'Yudhishthira did not want a kingdom bought with so much blood. Krishna brought him to Bhishma, still lying on his bed of arrows, so that the grandsire could teach him how to be a king.'},teachHub(['king','dharma','death','names']),
  {who:'narrator',text:'When the sun turned north, Bhishma left his body, as he had chosen. Yudhishthira was crowned king, and ruled with justice for thirty-six years.'},{lesson:'rajadharma'}],
 mausala:[{panel:'dwarakaEnd',title:'The End of the Yadavas',text:'Thirty-six years later, Gandhari\u2019s curse came true. Krishna\u2019s own clan, the Yadavas, quarrelled at a drunken festival and destroyed one another. Balarama left the world in meditation by the sea.'},
  {panel:'krishnaEnd',title:'The Hunter\u2019s Arrow',text:'Krishna sat resting beneath a tree in the forest. A hunter named Jara mistook his foot for a deer and loosed an arrow. Krishna forgave him, and left the world. Soon after, the sea swallowed the city of Dwaraka.'},
  {who:'narrator',text:'Arjuna came to lead the survivors of Dwaraka to safety, and found that the Gandiva was too heavy for him to lift. Robbers attacked the travellers, and the greatest archer of the age could not stop them.'},
  {who:'narrator',text:'Vyasa told him gently: Time gives, and Time takes away. Your purpose is finished.'},{lesson:'time'},
  {who:'narrator',text:'The Pandavas crowned Abhimanyu\u2019s son Parikshit as king, set aside their crowns, and began to walk north toward the Himalayas with Draupadi. A dog followed them out of the city.'}],

  {who:'narrator',text:'Yudhishthira stepped toward the chariot, and the dog followed.'},
  {who:'indra',text:'No, not the dog. There is no place in heaven for dogs. Leave it and come. You left your brothers and your wife on the road; why not a dog?'},

   {label:'Leave the dog. Heaven is waiting.',short:'Abandoned the dog for heaven',dharma:-20,then:[{who:'narrator',text:'You chose differently from the epic. In the Mahabharata, Yudhishthira refused, saying that abandoning a faithful companion was as great a sin as any he knew.'}]}]},
  {panel:'dharmaDog',title:'The Dog Was Dharma',text:'Then the dog changed shape. It was Dharma himself, Yudhishthira\u2019s father, who had walked beside him all along. He had tested his son once at the lake of the Yaksha, and now once more, and both times Yudhishthira chose compassion.'},{lesson:'dog'}],
 svarga:[{panel:'svarga',title:'Heaven',text:'In heaven, the first person Yudhishthira saw was Duryodhana, seated in glory and shining like the sun. His brothers and Draupadi were nowhere to be seen.'},
  {who:'yudhi',text:'Duryodhana, in heaven? Where are my brothers? Where is Karna? Where is Draupadi?'},
  {who:'narrator',text:'A messenger led him down a dark and terrible path, where he heard voices crying out in pain. They were the voices of Bhima, Arjuna, Nakula, Sahadeva, Draupadi and Karna. They begged him to stay, because his presence eased their suffering.'},

  {panel:'reunion',title:'The Last Illusion',text:'The darkness vanished. It had been an illusion, a final test, and also the price of the one half-truth Yudhishthira told at Kurukshetra. He bathed in the heavenly Ganga, left his human body, and found his brothers, Draupadi and Karna together in light, with every enmity gone.'},

function hx3(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function toHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function mixH(a,b,f){const A=hx3(a),B=hx3(b);return toHex(A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f);}
function shH(h,f){const c=hx3(h);return f<1?toHex(c[0]*f,c[1]*f,c[2]*f):toHex(c[0]+(255-c[0])*(f-1),c[1]+(255-c[1])*(f-1),c[2]+(255-c[2])*(f-1));}
function lumH(h){const c=hx3(h);return(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;}
function rgba(h,a){const c=hx3(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

/* the design rules, kept in code so every new piece can be checked against them */
const DESIGN_RULES={
 style:'Pahari and Rajput miniature painting in 2.5D: flat colour with gentle shading, fine warm-brown outlines, paper grain, layered depth.',
 shapes:'Clouds, fire, flags, wood and water are geometric motifs with a painted finish: equal lobes, symmetric flames, straight edges, scallop waves.',
 skies:'Skies are smooth ambient gradients with soft glows. No bands, no blocks. Theme changes cross-fade; colours never jump.',
 hud:'Top left: hero bars with no numbers on them, the visual is enough. Top right: the chapter plate. Both plates the same size, with a backing wide enough that nothing sits on its edge. Plates, journey bar and boss bar stay visible during in-level dialogue.',
 pickups:'Pickups sit on a brass thali with a soft glow and rising sparks. No rings or circles around them.',
 specials:'Every special move opens with a mandala burst at the hero in the move\u2019s colour and a name ribbon with its icon.',
 skip:'N skips only the current fight or minigame. It never skips story scenes or chapters.',
 stability:'An error in one frame must never freeze the game: update and drawing recover independently, and a missing dialogue returns to play.',
 animals:'Animals follow the miniature convention: flat warm colour, lighter belly, pattern marks, almond eye, fine outline, never larger than the people beside them.',
 layout:'Layout flows top to bottom; nothing overlaps. Learnings wait for calm. Characters speak on parchment, the game on lacquer.'};

const _hudBackMM=hudBack;hudBack=function(x,y,w,h,dir){if(h>=60&&y<=20)return _hudBackMM(dir>0?0:x-14,4,w+24,h+18,dir);return _hudBackMM(x,y,w,h,dir);};

function astraMandala(cam){const n=game.astraName;if(!n||!player)return;const k=Math.min(1,n.t/0.9);if(k>=1)return;const A=ASTRAS[n.i];const px=player.x-cam,py=GT+player.z-(player.h||0)-70,a=1-k,r=40+easeO(k)*150;ctx.save();ctx.globalAlpha=a;ctx.translate(px,py);ctx.scale(1,0.55);ctx.rotate(n.t*1.2);ctx.strokeStyle=A.col;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,0,r*0.78,0,7);ctx.stroke();for(let i=0;i<12;i++){ctx.save();ctx.rotate(i*Math.PI/6);ctx.fillStyle=A.col;ctx.globalAlpha=a*0.55;ctx.beginPath();ctx.moveTo(0,-r*0.8);ctx.quadraticCurveTo(r*0.09,-r*0.94,0,-r*1.08);ctx.quadraticCurveTo(-r*0.09,-r*0.94,0,-r*0.8);ctx.fill();ctx.restore();}ctx.restore();ctx.save();ctx.globalAlpha=a*0.5;pGlow(ctx,px,py,90+r*0.4,A.col,0.6);ctx.restore();}
drawAstraName=function(){const n=game.astraName;if(!n)return;n.t+=0;const A=ASTRAS[n.i];if(!A)return;const a=Math.max(0,Math.min(1,n.t*5,(1.8-n.t)*2.5));if(a<=0)return;ctx.save();ctx.globalAlpha=a;const y=H*0.76,sl=(1-easeO(Math.min(1,n.t*3)))*20;ctx.font='24px '+FONT_D;const tw=ctx.measureText(A.name).width;ctx.font='italic 600 14px '+FONT_B;const dw=ctx.measureText(A.desc).width;const w=Math.max(tw+70,dw+40),x=W/2-w/2;ctx.fillStyle=DS.col.lacquer;rr(x,y-24+sl,w,62,31);ctx.fill();ctx.strokeStyle=A.col;ctx.lineWidth=1.4;ctx.stroke();astraIcon(n.i,x+28,y+7+sl,13);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='24px '+FONT_D;ctx.shadowColor=A.col;ctx.shadowBlur=12;ctx.fillStyle=A.col;ctx.fillText(A.name,W/2+12,y-2+sl);ctx.shadowBlur=0;ctx.font='italic 600 14px '+FONT_B;ctx.fillStyle=IVORY;ctx.fillText(A.desc,W/2+12,y+22+sl);ctx.restore();};

drawSky=function(){const hz=OY+GT,k=themeKey(),sk=TH.sky;const cv=pkCache('sky2_'+k,W,hz+6,(c,w,h)=>{const g=c.createLinearGradient(0,0,0,h);const st=[0,0.35,0.62,0.85,1];for(let i=0;i<5;i++){g.addColorStop(st[i],sk[i]);if(i<4)g.addColorStop((st[i]+st[i+1])/2,mixH(sk[i],sk[i+1],0.5));}c.fillStyle=g;c.fillRect(0,0,w,h);pGlow(c,w*0.5,h,w*0.75,sk[4],0.45);pGlow(c,w*0.7,h*0.55,w*0.5,shH(sk[3],1.15),0.25);const R=mulberry32(5);for(let i=0;i<w*h/900;i++){c.fillStyle=R()<0.5?'rgba(255,255,255,0.025)':'rgba(0,0,0,0.025)';c.fillRect(R()*w,R()*h,2,2);}if(TH.stars||k==='hall'||k==='night'){for(let i=0;i<140;i++){const x=R()*w,y=R()*h*0.6,b=R();c.fillStyle='rgba(255,250,230,'+(0.25+b*0.6)*(1-y/(h*0.65))+')';c.fillRect(x,y,b>0.9?2:1.2,b>0.9?2:1.2);}}});try{ctx.drawImage(cv,0,0,W,hz+6);}catch(e){}if(TH.stars||k==='hall'||k==='night'){for(let i=0;i<14;i++){const x=(i*173.3)%W,y=(i*61.7)%(hz*0.5),a=Math.max(0,Math.sin(game.t*1.6+i*2.1));ctx.fillStyle='rgba(255,252,235,'+a*0.9+')';ctx.beginPath();ctx.arc(x,y,1.4,0,7);ctx.fill();}}};

let FADECV=null,FADEA=0,LASTTH=null;
